spring.application.name=Catalogue
server.port=8098



spring.datasource.url=jdbc:mysql://localhost:3306/livres?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sa




spring.jpa.hibernate.ddl-auto=update
spring.data.jdbc.dialect=mysql

